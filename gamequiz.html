<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Missing Number Quiz</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f9fafb;
            --surface: #ffffff;
            --text: #1f2937;
            --text-muted: #4b5563;
            --success: #10b981;
            --error: #ef4444;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            color: #111827;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        .progress-bar {
            height: 6px;
            background-color: var(--border);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .question {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background-color: var(--surface);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f5f3ff;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #ecfdf5;
            border-color: var(--success);
            color: #065f46;
        }

        .option-btn.incorrect {
            background-color: #fef2f2;
            border-color: var(--error);
            color: #991b1b;
        }

        .feedback {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .feedback.correct-feed {
            display: block;
            background-color: #ecfdf5;
            color: #065f46;
            border-left: 4px solid var(--success);
        }

        .feedback.incorrect-feed {
            display: block;
            background-color: #fef2f2;
            color: #991b1b;
            border-left: 4px solid var(--error);
        }

        .action-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        .results-screen {
            text-align: center;
            padding: 20px 0;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #f5f3ff;
            border: 4px solid var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0 auto 24px;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-box">
    <h1>Algorithm Challenge: Missing Numbers</h1>
    
    <div id="game-stage">
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="stats">
            <span id="question-number">Question 1 of 4</span>
            <span id="score-track">Score: 0</span>
        </div>

        <div class="question" id="question-text">Loading question...</div>
        <div class="options-list" id="options-box"></div>
        <div class="feedback" id="feedback-box"></div>
        
        <button class="action-btn" id="next-btn" style="display: none;">Next Question</button>
    </div>

    <div id="results-stage" class="results-screen" style="display: none;">
        <h2>Quiz Completed!</h2>
        <div class="score-circle" id="final-score">0/0</div>
        <p id="results-commentary" style="color: var(--text-muted); margin-bottom: 24px;"></p>
        <button class="action-btn" onclick="restartQuiz()">Try Again</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "Why does the loop in the 'Neighbor Comparison' method stop at len(arr) - 1?",
            options: [
                "Because Python data structures always drop the final index dynamically.",
                "To avoid an IndexError when checking the forward value using arr[i + 1].",
                "Because the final element of a sequence is mathematical dead-weight.",
                "To force the processor into an early optimization path loop."
            ],
            correct: 1,
            explain: "Correct! If the loop ran all the way to len(arr), trying to look up arr[i + 1] on the final pass would break your script with an out-of-bounds IndexError."
        },
        {
            question: "If a sorted array is, what basic values will the Gauss index formula map to 'first' and 'last' parameters?",
            options: [
                "first = 0, last = 4",
                "first = 1, last = 15",
                "first = 10, last = 15",
                "first = 10, last = 14"
            ],
            correct: 2,
            explain: "Spot on! Grabbing index positions arr[0] and arr[-1] will pull the structural perimeter numbers directly: 10 and 15."
        },
        {
            question: "What happens if you run the Gauss index algorithm on an un-sorted array?",
            options: [
                "Python compiler alerts a strict static SyntaxError code.",
                "The logic runs cleanly but outputs an erratic, incorrect value.",
                "The sequence automatically sorts itself using default underlying heuristics.",
                "The function enters an processing loop trap that hangs the computer."
            ],
            correct: 1,
            explain: "Exactly. The program doesn't crash, but because the boundaries aren't the true min/max bounds of the sequence, the math breaks down and gives you junk answers."
        },
        {
            question: "Which option outlines a shared structural weakness of BOTH the Neighbor method and the Gauss index method?",
            options: [
                "Neither configuration can work with sets containing odd numbers.",
                "They collapse if the structural missing variable resides at the absolute boundaries (before first or after last).",
                "They require numbers to be converted to fractional floating integers.",
                "They require a secondary hashing library overhead array to execute lookups."
            ],
            correct: 3,
            /* Fix explicit key assignment discrepancy mapping option 4 index -> index 1 */
            correct: 1, 
            explain: "Perfect! If a value vanishes right outside the visible margins of the sample array (e.g. your sequence is missing its true start or end value), neither mechanism can detect it because the inside sequence looks flawless."
        }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        const q = questions[currentIdx];
        
        // Update track metadata UI elements
        document.getElementById("question-text").innerText = q.question;
        document.getElementById("question-number").innerText = `Question ${currentIdx + 1} of ${questions.length}`;
        document.getElementById("score-track").innerText = `Score: ${score}`;
        document.getElementById("progress").style.width = `${((currentIdx) / questions.length) * 100}%`;
        
        const optBox = document.getElementById("options-box");
        optBox.innerHTML = "";
        
        const feedBox = document.getElementById("feedback-box");
        feedBox.className = "feedback";
        feedBox.innerText = "";
        document.getElementById("next-btn").style.display = "none";

        q.options.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(i);

            optBox.appendChild(btn);
            });
            }
            function selectOption(selectedIdx) {
            if (answered) return;
            answered = true;
            const q = questions[currentIdx];
            const buttons = document.getElementById("options-box").children;
            const feedBox = document.getElementById("feedback-box");
            if (selectedIdx === q.correct) {
            buttons[selectedIdx].classList.add("correct");
            feedBox.innerText = q.explain;
            feedBox.classList.add("correct-feed");
            score++;
            document.getElementById("score-track").innerText = `Score: ${score}`;
            } else {
            buttons[selectedIdx].classList.add("incorrect");
            buttons[q.correct].classList.add("correct");
            feedBox.innerText = "Incorrect choice. " + q.explain;
            feedBox.classList.add("incorrect-feed");
            }
            for (let btn of buttons) {
            btn.disabled = true;
            }
            const nextBtn = document.getElementById("next-btn");
            if (currentIdx === questions.length - 1) {
            nextBtn.innerText = "Finish Quiz";
            } else {
            nextBtn.innerText = "Next Question";
            }
            nextBtn.style.display = "block";
            }
            document.getElementById("next-btn").onclick = () => {
            currentIdx++;
            if (currentIdx < questions.length) {
            loadQuestion();
            } else {
            showResults();
            }
            };
            function showResults() {
            document.getElementById("game-stage").style.display = "none";
            document.getElementById("results-stage").style.display = "block";
            document.getElementById("progress").style.width = "100%";
            const finalScoreBox = document.getElementById("final-score");
            finalScoreBox.innerText = `Score: ${score}/${questions.length}`;
            const comment = document.getElementById("results-commentary");
            const percentage = (score / questions.length) * 100;
            if (percentage === 100) {
            comment.innerText = "Flawless performance! You're ready to teach this optimization concept to the class.";
            } else if (percentage >= 75) {
            comment.innerText = "Great job! You have a solid grasp on how mathematical and logic-driven array lookups function.";
            } else {
            comment.innerText = "Good effort! Review the differences between local loops and algebraic checks to master these edge cases.";
            }
            }
            function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById("results-stage").style.display = "none";
            document.getElementById("game-stage").style.display = "block";
            loadQuestion();
            }
            // Initialize tracking logic on load lifecycle hook
            loadQuestion()
</script>
</body> 
</html>
